[package]
name = "python-bindings"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "gf2_linalg"
crate-type = ["cdylib"]
doc = false

[dependencies]
concat-idents = "1.1.5"

[dependencies.pyo3]
version = "0.29.0"
features = ["experimental-inspect", "multiple-pymethods"]

[dependencies.gf2-linalg]
path = "../gf2-linalg"
features = ["rand"]

[dependencies.rand]
version = "0.10"
default-features = false
